# tickets.toml — the epic's agreed children. Table order is build order; `id` is permanent and not an order.

[[entry]]
id = 1
type = "story"
title = "Web stack: router with URL search params, table and virtual list, Tailwind/shadcn"
description = "Adopts TanStack Router with typed search params and builds the app shell and navigation every later page plugs into (each later entry adds only its own route), TanStack Table and Virtual, and Tailwind/shadcn, and moves the existing pages (setup, sign-in, status, recovery, and epic-ledger-accounts-privacy's minimal list page) onto it with no change in behaviour; shadcn's injected styles use the CSP nonce."
verify = "Existing web and e2e tests pass, the CSP e2e test stays green, and a route's typed search params round-trip."
covers = ["CAP-18"]
after = ["2.1"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Transaction list: URL filters, keyset paging, virtualised"
description = "A list API with keyset paging and filters (account, date range, category, tag, payee, amount, hidden), all on visibleTxn, with a filter parser export and search reuse; text search joins it in entry 5; the list page holds the filters in URL search params and renders a virtualised table."
verify = "API tests for paging and filters per viewer; an e2e test filters the seeded ledger through the URL."
covers = ["CAP-18"]
after = [1, "2.8"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Edit splits, tags, beneficiary and hiding"
description = "A split editor showing the remaining amount the server returns, a tag picker, a beneficiary picker and a hide-name toggle that warns notes stay visible, all calling epic-ledger-accounts-privacy's ledger API."
verify = "Component and e2e tests for each edit; nothing in the editor sums money on the client."
covers = ["CAP-18", "CAP-14", "CAP-3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Account screens"
description = "Create and edit accounts, owners and shares, and privacy (with the refusal when splits are shared), calling the accounts API."
verify = "Component and e2e tests for create, owners and the privacy refusal."
covers = ["CAP-3", "CAP-14"]
after = [1, "2.8"]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Search"
description = "FTS5 over visibleTxn keyed on a stable integer, with triggers kept through table rebuilds, excluding hidden names for the partner; a search API, the list API's text filter through it, and a basic search UI."
verify = "API tests per viewer show a hidden name never matches for the partner; the index survives a table-rebuild migration."
covers = ["CAP-3", "CAP-18"]

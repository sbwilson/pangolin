# tickets.toml — epic-import-dedupe-transfers
# Table order is build order; id is permanent.

[[entry]]
id = 1
type = "story"
title = "Core import engine, schema, and CommBank OFX/CSV parsing"
description = "Implements import_batch and import_row schema with migration, fingerprint dedupe engine with occurrence counts, CommBank OFX/CSV normalisation, and mock statement generator across all v1 formats."
verify = "Unit and integration tests verify CommBank OFX and CSV parse, dedupe with occurrence counts, and commit transactions idempotently."
covers = ["IMP-1"]
after = ["2.8", "13.1"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Format parsers suite and anonymised test fixtures"
description = "Adds parsers for ubank CSV, Up CSV, QIF, FY2025 multi-bank format, and generic CSV mapper with column mapping config, backed by committed anonymised test files."
verify = "Test suite imports every format's sample file; re-importing the same file or overlapping dates adds zero rows."
covers = ["IMP-2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Partial import and set-aside rows"
description = "Implements partial import for CSV/OFX/QIF: invalid lines are set aside in import_row with row number and reason, good rows commit, and set-aside rows gather into an import.set_aside review item with inline fix/discard."
verify = "A file with invalid rows commits good rows, sets aside bad rows, and fixing a set-aside row commits it through the same batch."
covers = ["IMP-3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Payee matching, aliases, and rule engine"
description = "Implements payee alias matching (payee_alias), fuzzy matching against known payees, deterministic rule engine in priority order, payee default category fallback, and offering a new rule on correction."
verify = "Unit tests verify rule matching order, payee defaults, unclassified splits marked for review, and rule generation from user corrections."
covers = ["IMP-4"]
after = [1, "2.9"]
hitl = false
risk = "medium"

[[entry]]

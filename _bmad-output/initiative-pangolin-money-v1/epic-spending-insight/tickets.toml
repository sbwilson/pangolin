type = "story"
title = "Net worth page with trend"
description = "Adds a `netWorth(viewer, asOf)` use case over cash, card and loan accounts using `balanceAsOf`, with assets, liabilities and subtotals by account type, a 12-point monthly trend derived on read, and the `/net-worth` page with KPIs, the trend chart and its table, stale-account captions with an Import shortcut, the owner-only private lock, an empty state and a disabled Forecast link; property, valuation and brokerage lines are left as slots for epics 14 and 9."
verify = "Net worth for each partner equals a hand sum of the accounts they can see, never includes the other partner's private accounts, shared figures match for both, the trend has 12 points that match month-end balances, and the page renders its empty state with no accounts."
covers = ["CAP-17"]
after = [5]
hitl = false
risk = "medium"


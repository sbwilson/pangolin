[[entry]]
id = 7
type = "story"
title = "Biggest little leaks"
description = "Adds a use case and tile, on Cash flow and Spending, listing the top five merchants by total spend in the range that have at least four transactions and a median amount of $25 or less, built on `visibleTxn` so hidden names never appear, each drilling to Transactions; no flexible-category tag."
verify = "On the seeded household the tile lists the merchants a hand calculation gives, a hidden-name merchant never appears for the partner, and a click lands on Transactions filtered to that merchant."
covers = ["CAP-17"]
after = [2]
hitl = false
risk = "medium"
unknown = "The leak rule (top five, at least four transactions, median $25 or less) is the builder's proposal and is not in the spec."


type = "story"
title = "Leaving the household deletes the leaver's private data"
description = "Adds a leaveHousehold use case in packages/app/src/accounts that requires the leaver to re-authenticate and confirm, then hard-deletes the leaver's private data only: the leaver's private accounts and all their own rows through an internal cascade deleteAccountRows (transactions, splits, split tags, balance snapshots, owners, transfer-group links, account-scoped review items; the surviving side of any transfer is unlinked as decision 81 allows), the leaver-scoped payees, aliases, tags and activities (scope_person_id; where partner-visible shared rows still reference them the references are nulled), the leaver's person-scoped review items (person_id) and the audit rows scoped to the leaver or belonging to their deleted private accounts; it lifts every hiding the leaver made, through an owner-audited upkeep write that works even when the account has since turned private to the partner; it keeps every shared account and its expenses, removing the leaver from the owners so the partner is the sole owner (the internal path, since entry 20's last-owner rule forbids it through updateAccount), and keeps the audit rows of shared data; it revokes the leaver's sessions and credentials and marks the person as having left (person.deleted_at, which identity-repos already filters); the upkeep writes bypass entry 23's closed-date lock; earlier backups keep the data, accepted; the confirmation and re-authentication screens belong to epic-app-shell-settings-theming (handoff note there) (Simon, 2026-10-06)."
verify = "In paired worlds, one where the leaver had private accounts, hidings and scoped payees and one where they had none, after a confirmed and re-authenticated departure the partner's responses are byte-identical; the leaver's private accounts, scoped rows and their audit rows are gone, their hidings are lifted and readable by the partner, every shared account and its expenses remain with the partner as sole owner, and the leaver has no session or credential left; leaving without the re-authentication or the confirmation changes nothing."
covers = ["CAP-3"]
after = [20, 23]   # order and collision: both edit update-account.ts and the ledger write use cases; 23's lock has the upkeep bypass this entry relies on
hitl = false
risk = "high"
unknown = "None open. Settled by Simon on 2026-10-06: a public account owned only by the leaver passes to the partner as sole owner, as when ownership of an account (a home loan, say) is transferred with a property; 'their audit rows' are the rows scoped to the leaver and the rows of their deleted private accounts, while audit rows the leaver authored on shared data stay as shared history, shown as a former member. Re-authentication reuses the sign-in flow of identity; whether it needs a fresh passkey or a recovery step is the builder's call."

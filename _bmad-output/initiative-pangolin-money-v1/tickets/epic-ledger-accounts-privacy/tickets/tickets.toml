[[entry]]
id = 20
type = "story"
title = "Either person may share a public account and change who is on it"
description = "Replaces updateAccount's self-removal-only rule (packages/app/src/accounts/update-account.ts:62,105-117, requireOnlySelfRemoved, entry 15) with Simon's relaxed rule: either person may mark a public account shared by adding themself or the other person, and may remove themself or the other person, provided at least one owner remains (the last owner cannot be removed; closing the account is how it ends) and the account is not private (owner changes on a private account stay refused); a person removed by the other still sees the account, now marked on it as 'you've been removed, undo?', where undo adds them back, and the marker comes from the owner change itself, not from the review inbox, which does not exist yet; the system viewer stays exempt; a transfer of an account to the other person (a home loan moved with a property, say) is the same two steps on a public account, adding them and then removing oneself, and the account keeps its whole history, with the contribution of past periods untouched; the hide rule is unchanged (only an owner may hide a name, which a person can now become by adding themself). Updates the tests that encode self-removal only, in packages/db/src/accounts.test.ts, packages/app/src/testing/accounts-parity.test.ts and apps/server/src/http/app.test.ts, and the privacy suite step of entry 18 (privacy-scenarios.ts) that expects the refusals (retro N1, reclassified as a decision)."
verify = "Over HTTP, B (not an owner) adds themself to A's sole-owner public account, and either owner removes the other, each with 200 and the owners as asked; removing the last owner is refused with Validation; an owner change on a private account is refused; the removed person's read of the account shows that they were removed and by whom, and an undo adds them back; a hiding made by a person still holds after that person is removed or leaves the account (it is lifted only when the person leaves the household); and the privacy-suite worlds and parity tests pass with the new expectations."
covers = ["CAP-3", "CAP-14"]
after = [15, 18]
hitl = false
risk = "medium"
unknown = "None open. Settled by Simon on 2026-10-06 (this is not an adversarial relationship): either person may share a public account and remove themself or the other; a removed person sees the account marked 'you've been removed, undo?' and can add themself back; a hiding survives its hider's removal, because the hider can add themself back and lift it. Design left to the builder: where the removal marker is stored, since nothing records it today beyond the audit row."


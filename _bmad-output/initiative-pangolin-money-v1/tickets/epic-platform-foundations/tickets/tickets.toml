[[entry]]
id = 15
type = "story"
title = "Safe pre-upgrade copy"
description = "Makes pangolin upgrade refuse to stop the stack unless the pre-upgrade database copy is non-empty, creates that copy mode 0700, and removes the .env.bak, compose.yaml.bak and pangolin.bak files after a successful upgrade, so a failed copy can never turn a rollback into data loss and a stale backup file is never restored over a good install."
verify = "deploy/pangolin tests show a failed or empty copy aborts before the stack is stopped, a rollback never deletes the live database, the copy directory is 0700, and a leftover .bak from an earlier upgrade is not restored by an interrupted one."
covers = ["CAP-16"]
after = [13]
hitl = false
risk = "high"
references = ["retrospective — _bmad-output/initiative-pangolin-money-v1/epic-platform-foundations/epic-platform-foundations-retrospective.md, findings S1, S2 and S3", "ops — _bmad-output/specs/spec-pangolin-money/deployment-and-ops.md, Install and upgrade"]


# tickets.toml — the epic's agreed children. Table order is build order; `id` is permanent and not an order.

[[entry]]
id = 1
type = "story"
title = "Web stack: router with URL search params, table and virtual list, Tailwind/shadcn"
description = "Adopts TanStack Router with typed search params and builds the app shell and navigation every later page plugs into (each later entry adds only its own route), TanStack Table and Virtual, and Tailwind/shadcn, and moves the existing pages (setup, sign-in, status, recovery, and epic-ledger-accounts-privacy's minimal list page) onto it with no change in behaviour; shadcn's injected styles use the CSP nonce."
verify = "Existing web and e2e tests pass, the CSP e2e test stays green, and a route's typed search params round-trip."
covers = ["CAP-18"]
after = ["2.1"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Transaction list: URL filters, keyset paging, virtualised"
description = "A list API at the unchanged path `/api/ledger/transactions` with keyset paging, a server-side total count, and filters (account, date range, category, tag, payee, amount, type in/out, uncategorised, transfers, hidden), all on visibleTxn, with a filter parser export and search reuse (text search joins it in entry 5); the list page at `/transactions` (`/ledger` replace-redirects there, keeping its search params) with chips All · Needs review · Uncategorised · Transfers, Type (in/out), Account and Category selects and the date range (Quarter · FY to date · Custom) in URL search params, a Clear filters that resets all but the date range, the date-range control in its own page header until epic 13's shell header takes over, rows grouped by date with a server-computed day net, a server-computed summary line (count, in, out), a pager reading 'Showing X of N · Page p of P' (50 rows a page; next and previous follow keyset cursors, and a jump to page p [ASSUMPTION] runs the same sort with OFFSET (p−1)×50 over the filter's index and returns the cursor for paging on) and a virtualised table, with an empty state ('No transactions yet'; its Import button waits for epic-import-dedupe-transfers) and a no-match state ('Nothing matches those filters.' + Clear filters), and on phone the Account column and bulk select hidden; the Needs review chip is wired to data only once epic-import-dedupe-transfers' review inbox exists [ASSUMPTION: shown disabled until then]; it owns the CSP nonce wiring for popover, sheet and toast, and a nav badge that [ASSUMPTION] counts the viewer's uncategorised rows, on entry 1's sidebar (Ledger item renamed Transactions)."
verify = "API tests for keyset paging, a page jump landing on the same rows keyset paging reaches, the total count and 'Page p of P' per viewer, each filter (Type, Uncategorised and Transfers included) and the badge count per viewer, an e2e test filtering the seeded ledger through the URL, a check that `/ledger?…` lands on `/transactions` with the same search params and no extra history entry, a CSP e2e check opening a popover, a sheet and a toast with no violation, a check that at zero the badge shows a check, an e2e test that Clear filters keeps the date range and that the empty and no-match states render, a phone-width (375 px) check that filters, summary line and list render with the Account column and bulk select hidden, a 320 px reflow check (WCAG) with no horizontal page scroll, entry 1's 1000-row virtualisation test in `routing.spec.ts` passing at `/transactions` with date-group headers, and no client sums pass, with paths in `routing.spec.ts` and `ledger.spec.ts` updated."
covers = ["CAP-18"]
after = [1, "2.8"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Transaction sheet: splits, tags, notes, beneficiary and hiding"
description = "A transaction sheet with a split editor showing the remaining amount the server returns, a category combobox (through setSplitField), a tag picker, notes, a beneficiary picker and a hide-name toggle that warns notes stay visible, plus the list row's inline category chip edit [ASSUMPTION per UX] through the same combobox, all calling epic-ledger-accounts-privacy's ledger API, where the owner sees a 'Hidden from <partner> until <date>' tag and the partner a wink row ('Hidden until <date>'); the sheet relies on entry 2's CSP nonce wiring and e2e check (it reaches entry 2 through after), and entry 12 reuses its category combobox and tag picker."
verify = "Component and e2e tests for each edit pass, including one hidden transaction showing the owner the 'Hidden from <partner> until <date>' tag and the partner the wink row ('Hidden until <date>'), whose accessible name reads 'Hidden until 12 March 2027' with the wink line as its description, a test that the row's category chip edits inline, and a phone-width (375 px) check that the sheet opens from the bottom; nothing in the editor sums money on the client."
covers = ["CAP-18", "CAP-14", "CAP-3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Account screens"
description = "Create and edit accounts, owners and shares, and privacy, surfacing the accounts API's refusals (splits shared, and 2.15's removing another owner, setPrivacy(private) with a partner beneficiary split, and setPrivacy(public)'s Conflict naming the scoped references and the owners), on an Accounts page grouping rows as Cash (transaction, offset) · Savings (savings) · Cards (credit_card) · Loans (home_loan) · Investments (brokerage, super) · Other (vehicle, other) with a separate Properties card placeholder, the owner-only lock and the stale caption, and `/accounts/:id` showing the balance, freshness and that account's transactions through entry 2's list and date-range control filtered to the account; freshness and staleness (> 45 days) come from the account's newest posted_on [ASSUMPTION] (no import_batch yet), while import provenance and the stale row's Import shortcut wait for epic-import-dedupe-transfers and the '% repaid' caption and 'Add loan by hand' for epic-loans-property."
verify = "Component and e2e tests for create, owners and the privacy refusal pass, as do e2e checks that the seeded accounts land in their groups with the Properties card placeholder, an account whose newest posted_on is over 45 days old shows the stale caption in the warning colour, and `/accounts/:id` shows that account's balance, freshness and only its transactions within the URL's date range."
covers = ["CAP-3", "CAP-14"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Search"
description = "FTS5 over visibleTxn keyed on a stable integer, with triggers kept through table rebuilds, where a hidden-name row is excluded from the partner's search entirely (by name, amount, notes or any other field) while its owner still finds it; a search API, the list API's text filter through it, and a basic search UI; amount search beside FTS5 matching by magnitude, so '142' matches $142.00–$142.99 and '142.85' only $142.85 [ASSUMPTION: sign is ignored, so money in and out match alike]."
verify = "API tests per viewer show a hidden-name row never matches for the partner, whether searched by name, by amount or by notes, while the owner still finds it by each, '142' matches $142.00 and $142.99 in and out but not $143.00, and '142.85' matches only $142.85; the index survives a table-rebuild migration."
covers = ["CAP-3", "CAP-18"]
after = [4]
hitl = false
risk = "high"


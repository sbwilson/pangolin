# tickets.toml — the initiative's epics. Table order is build order; `id` is permanent and not an order.

[[epic]]
id = 1
slug = "epic-platform-foundations"
title = "Platform foundations"
covers = ["CAP-16", "CAP-15"]

[[epic]]
id = 2
slug = "epic-ledger-accounts-privacy"
title = "Ledger core and privacy"
covers = ["CAP-3", "CAP-18", "CAP-14", "CAP-16"]
after = [{ epic = 1, needs = "schema and migration tooling, auth sessions, service layer with audit_log, seed generator" }]

[[epic]]
id = 12
slug = "epic-ledger-workspace"
title = "Ledger workspace"
covers = ["CAP-18", "CAP-3", "CAP-14", "CAP-16"]
after = [{ epic = 2, needs = "the accounts, classify and ledger modules and API, the privacy core and the seeded ledger" }]

[[epic]]
id = 13
slug = "epic-app-shell-settings-theming"
title = "App shell, settings and theming"
covers = ["CAP-21"]
after = [
  { epic = 12, needs = "router, shell, shadcn from entry 1 and the /transactions route from entry 2" },
  { epic = 1, needs = "identity: person, sessions, passkey sign-in, recovery and partner reset, and the system status routes" },
]

[[epic]]
id = 11
slug = "epic-platform-hardening"
title = "Platform hardening"
covers = ["CAP-16", "CAP-15"]
after = [{ epic = 1, needs = "install.sh, uninstall.sh, the firewall render and the release workflow" }]

[[epic]]
id = 3
slug = "epic-import-dedupe-transfers"
title = "Import, dedupe and transfer matching"
covers = ["CAP-1", "CAP-2", "CAP-18"]
after = [
  { epic = 2, needs = "account, transaction, split and transfer_group tables with visibleAccounts()/redact()" },
  { epic = 13, needs = "the shell's Import button and Needs review nav, and the Settings page the identity notices leave" },
]

[[epic]]
id = 4
slug = "epic-spending-insight"
title = "Spending and cash-flow insight"
covers = ["CAP-17", "CAP-14"]
after = [
  { epic = 3, needs = "categorised splits imported from real statements" },
  { epic = 13, needs = "the `/` landing redirect this epic switches to `/cash-flow`" },
]

[[epic]]

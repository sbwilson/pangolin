name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase repo
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Untagged: pushed by digest, then scanned and signed, and only then tagged below.
          outputs: type=image,name=ghcr.io/${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
          build-args: PANGOLIN_VERSION=${{ github.ref_name }}
          provenance: false
          sbom: false
      - uses: anchore/scan-action@v7
        with:
          image: ghcr.io/${{ env.REPO }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Tag the image
        run: |
          MAJOR_MINOR=$(echo "${{ github.ref_name }}" | grep -oE '^v[0-9]+\.[0-9]+')
          docker buildx imagetools create \
            -t ghcr.io/${{ env.REPO }}:${{ github.ref_name }} \
            -t ghcr.io/${{ env.REPO }}:${MAJOR_MINOR} \
            -t ghcr.io/${{ env.REPO }}:latest \
            ghcr.io/${{ env.REPO }}@${{ steps.build.outputs.digest }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --tlog-upload=false -y "ghcr.io/${{ env.REPO }}@${{ steps.build.outputs.digest }}"
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - name: Attach SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.REPO }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest SBOM
        run: |
          cosign attest --key cosign.key --type spdxjson --predicate sbom.spdx.json --tlog-upload=false -y "ghcr.io/${{ env.REPO }}@${{ steps.build.outputs.digest }}"
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            deploy/install.sh
            deploy/cosign.pub


  upgrade-test:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase repo
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build image A (healthy base)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: localhost:5000/${{ env.REPO }}:v1.0.0
          build-args: PANGOLIN_VERSION=v1.0.0
      - name: Add extra migration for image B
        run: |
          echo "CREATE TABLE _upgrade_test_sentinel (id INTEGER PRIMARY KEY) STRICT;" > packages/db/migrations/0006_test_sentinel.sql
          # The migration loader rejects a .sql file that is not in the journal.
          node -e '
            const fs = require("node:fs");
            const p = "packages/db/migrations/meta/_journal.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const last = j.entries[j.entries.length - 1];
            j.entries.push({ idx: last.idx + 1, version: last.version, when: last.when + 1000, tag: "0006_test_sentinel", breakpoints: true });
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          '
      - name: Build image B (healthy + extra migration)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: localhost:5000/${{ env.REPO }}:v2.0.0
          build-args: PANGOLIN_VERSION=v2.0.0
      - name: Remove extra migration (C is forced-unhealthy without it)
        run: |
          rm packages/db/migrations/0006_test_sentinel.sql
          git checkout -- packages/db/migrations/meta/_journal.json
      - name: Build image C (forced unhealthy — triggers rollback to B)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: localhost:5000/${{ env.REPO }}:v3.0.0
          build-args: |
            PANGOLIN_VERSION=v3.0.0
            PANGOLIN_TEST_FORCE_UNHEALTHY=1
      - uses: sigstore/cosign-installer@v3
      - name: Generate throwaway cosign key pair and sign images
        run: |
          COSIGN_PASSWORD="" cosign generate-key-pair
          COSIGN_PASSWORD="" cosign sign --key cosign.key --tlog-upload=false -y localhost:5000/${{ env.REPO }}:v1.0.0
          COSIGN_PASSWORD="" cosign sign --key cosign.key --tlog-upload=false -y localhost:5000/${{ env.REPO }}:v2.0.0
          COSIGN_PASSWORD="" cosign sign --key cosign.key --tlog-upload=false -y localhost:5000/${{ env.REPO }}:v3.0.0
      - name: Start stack on image A (the production compose file, as install.sh lays it out)
        run: |
          sudo mkdir -p /opt/pangolin/secrets /srv/pangolin
          sudo chmod 777 /opt/pangolin /opt/pangolin/secrets /srv/pangolin
          docker run --rm localhost:5000/${REPO}:v1.0.0 cat /app/deploy/compose.yaml > /opt/pangolin/compose.yaml
          openssl rand -base64 32 > /opt/pangolin/secrets/auth-secret
          openssl rand -base64 32 > /opt/pangolin/secrets/restic-password
          chmod 644 /opt/pangolin/secrets/*
          printf 'PANGOLIN_IMAGE=localhost:5000/%s:v1.0.0\nPANGOLIN_PUBLIC_URL=http://localhost:3000\n' "$REPO" > /opt/pangolin/.env
          sudo chmod 600 /opt/pangolin/.env
          cp cosign.pub /opt/pangolin/cosign.pub
          sudo docker compose --project-directory /opt/pangolin -f /opt/pangolin/compose.yaml up -d
          for i in $(seq 1 30); do
            [ "$(sudo docker inspect --format '{{.State.Health.Status}}' pangolin-pangolin-1)" = healthy ] && exit 0
            sleep 3
          done
          sudo docker compose --project-directory /opt/pangolin logs pangolin
          exit 1
      - name: Install wrapper script
        run: |
          docker run --rm localhost:5000/${REPO}:v1.0.0 cat /app/deploy/pangolin > /tmp/pangolin
          sudo install -m 755 /tmp/pangolin /usr/local/bin/pangolin
      - name: Upgrade to B (must succeed — B is healthy with extra migration)
        run: |
          sudo PANGOLIN_HOME=/opt/pangolin pangolin upgrade v2.0.0
          sudo docker compose --project-directory /opt/pangolin ps
          # B's schema applied: the sentinel table exists
          sqlite3 /srv/pangolin/pangolin.sqlite "SELECT count(*) FROM _upgrade_test_sentinel;"
      - name: Upgrade to C (must fail and roll back to B with B's schema)
        run: |
          set +e
          sudo PANGOLIN_HOME=/opt/pangolin pangolin upgrade v3.0.0
          rc=$?
          set -e
          [ $rc -ne 0 ] || { echo "Upgrade to C should have failed!"; exit 1; }
          # Rolled back to B: the failure marker was written and B's schema is still there
          # (the marker is consumed by the next start, which raised the review item)
          sqlite3 /srv/pangolin/pangolin.sqlite "SELECT count(*) FROM _upgrade_test_sentinel;"
          sudo grep -q '@sha256' /opt/pangolin/.env
          sudo docker compose --project-directory /opt/pangolin ps

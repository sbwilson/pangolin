name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1" # weekly: re-run against fresh base images and dependencies

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, STRICT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome + package boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests (Vitest)
        run: pnpm test
      - name: STRICT tables on a freshly migrated database
        run: pnpm check:strict
      - name: Migrations match the schema
        run: pnpm --filter @pangolin/db db:generate && git diff --exit-code -- packages/db/migrations
      - name: Shell scripts
        run: shellcheck -S warning .githooks/pre-commit .githooks/commit-msg scripts/install-git-hooks.sh deploy/pangolin deploy/*.sh deploy/firewall/*.sh
      - name: Production compose file is valid
        run: |
          stage="$RUNNER_TEMP/pangolin-stage"
          mkdir -p "$stage/etc"
          printf 'ID=debian\nVERSION_ID="13"\nVERSION_CODENAME=trixie\n' > "$stage/etc/os-release"
          sh deploy/install.sh --non-interactive --no-docker --root "$stage" \
            --hostname money.example.com --npm-host 192.168.1.10 \
            --admin-network 192.168.1.0/24 --dns 192.168.1.1 --backup-server ""
          docker compose -f "$stage/opt/pangolin/compose.yaml" --env-file "$stage/opt/pangolin/.env" config --quiet
          # The staged ruleset (and the fail-closed fallback) must load: checked, never applied.
          sudo apt-get install -y -q nftables
          sudo nft -c -f "$stage/opt/pangolin/firewall/pangolin.nft"
          sh deploy/firewall/render.sh --home "$stage/opt/pangolin" fallback > "$stage/fallback.nft"
          sudo nft -c -f "$stage/fallback.nft"
          # The runner's nft is older than the VM's, and newer parsers reject some syntax old ones
          # accept, so check both files again with Debian 13's own nftables.
          docker run --rm --cap-add NET_ADMIN -v "$stage":/s:ro debian:trixie sh -c \
            'apt-get update -qq && apt-get install -y -qq nftables > /dev/null && nft --version &&
             nft -c -f /s/opt/pangolin/firewall/pangolin.nft && nft -c -f /s/fallback.nft'

  container:
    name: Container and end-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the image
        run: docker compose build
      - name: Scan the image
        uses: anchore/scan-action@v6
        with:
          image: pangolin:local
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Backup settings (an append-only rest-server in the stack, a restic password file)
        run: |
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          head -c 32 /dev/urandom | base64 | tr -d '\n=' | tr '+/' '-_' > "$secrets/restic-password"
          chmod 0400 "$secrets/restic-password"
          sudo chown 1000:1000 "$secrets/restic-password"
          # Compose reads .env for every later command, including the host's pangolin wrapper.
          {
            echo "COMPOSE_PROFILES=backup"
            echo "PANGOLIN_BACKUP_REPOSITORY=rest:http://restic:8000/pangolin"
            echo "PANGOLIN_RESTIC_PASSWORD_HOST_FILE=$secrets/restic-password"
            echo "PANGOLIN_PUBLIC_URL=http://localhost:3000"
            echo "PANGOLIN_AUTH_RATE_LIMIT=100"
          } > .env
      - name: Start the stack
        run: docker compose up -d
        env:
          PANGOLIN_PUBLIC_URL: http://localhost:3000
          # The e2e suite signs in more often a minute than the default limit (10) allows.
          PANGOLIN_AUTH_RATE_LIMIT: "100"
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "The container never became healthy" >&2
          exit 1
      - name: Wait for Docker's health status
        run: |
          id=$(docker compose ps -q pangolin)
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            if [ "$status" = healthy ]; then echo "Docker reports $status"; exit 0; fi
            sleep 1
          done
          echo "Docker health status is still $status" >&2
          exit 1
      - name: The admin CLI reaches the running server over its socket
        run: docker compose exec -T pangolin node dist/cli.js status
      - name: The admin CLI refuses another uid
        run: |
          set +e
          out=$(docker compose exec -T -u 65534 pangolin node dist/cli.js status 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -qi "permission denied"
      - name: The image carries the deploy files a lone install.sh uses
        run: |
          docker run --rm --entrypoint sh pangolin:local -c \
            'test -f /app/deploy/compose.yaml && test -f /app/deploy/allowlist.conf.default && test -x /app/deploy/firewall/render.sh && test -x /app/deploy/pangolin'
      - name: The server runs as a non-root user
        run: |
          uid=$(docker compose exec -T pangolin sh -c 'stat -c %u /proc/$(pidof -s node)')
          echo "node runs as uid $uid"
          test "$uid" != 0
      - name: The image boots in demo mode
        run: |
          id=$(docker run -d -e PANGOLIN_DEMO=true -p 3001:3000 --read-only --tmpfs /tmp pangolin:local)
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/healthz; then
              echo
              docker rm -f "$id" > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "The demo container never became healthy" >&2
          docker logs "$id" >&2
          docker rm -f "$id" > /dev/null
          exit 1
      - name: Install Chromium for Playwright
        run: pnpm --filter @pangolin/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright against the container)
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          # The first-boot setup link lives in the container's data volume.
          E2E_SETUP_LINK_COMMAND: docker compose exec -T pangolin cat /data/setup-link.txt
          # Backups are configured (and none taken yet): the status page's backup line is checked.
          E2E_BACKUPS: "1"
      - name: Back up the end-to-end household (pangolin backup over the admin socket)
        run: |
          out=$(docker compose exec -T pangolin node dist/cli.js backup)
          echo "$out"
          echo "$out" | grep -Eq '^Backup done at .*: snapshot [0-9a-f]{64}$'
          status=$(docker compose exec -T pangolin node dist/cli.js status)
          echo "$status"
          echo "$status" | grep -Eq '^Backups:   last at .*, snapshot [0-9a-f]{64}$'
          # The staging directory is emptied once pushed.
          test -z "$(docker compose exec -T pangolin ls -A /data/backup/staging)"
      - name: The repository is append-only (restic forget from the app container is refused)
        run: |
          restic() {
            docker compose exec -T -e RESTIC_REPOSITORY=rest:http://restic:8000/pangolin \
              -e RESTIC_PASSWORD_FILE=/secrets/restic-password -e RESTIC_CACHE_DIR=/tmp/restic-cache \
              pangolin restic "$@"
          }
          set +e
          out=$(restic forget latest 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "403 Forbidden"
          test "$(restic snapshots --json | jq length)" -ge 1
      - name: Restore into the running stack's volume (the host's pangolin restore)
        run: |
          out=$(PANGOLIN_HOME="$PWD" sh deploy/pangolin restore latest)
          echo "$out"
          echo "$out" | grep -qx 'integrity_check: ok'
          echo "$out" | grep -Eq '^Manifest: all [0-9]+ tables match'
          echo "$out" | grep -Eq '^Swapped in snapshot [0-9a-f]{64}'
          # The restored.spec checks the status page names this snapshot as the last backup.
          echo "E2E_RESTORED_SNAPSHOT=$(echo "$out" | sed -En 's/^Swapped in snapshot ([0-9a-f]{64}).*/\1/p')" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "The restored stack never became healthy" >&2
          exit 1
      - name: Sign in to the restored household (password and TOTP)
        run: pnpm --filter @pangolin/e2e exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_RESTORED: "1"
      - name: Restore onto a clean host from the recovery bundle's values alone
        run: |
          # The recovery bundle as install.sh writes it (the application key has no use yet).
          bundle="$RUNNER_TEMP/recovery-bundle.txt"
          {
            echo "PANGOLIN_AUTH_SECRET=$(docker compose exec -T pangolin cat /data/auth-secret)"
            echo "RESTIC_PASSWORD=$(sudo cat "$RUNNER_TEMP/secrets/restic-password")"
            echo "RESTIC_REPOSITORY=rest:http://restic:8000/pangolin"
          } > "$bundle"
          # A clean host: the image, a fresh volume and those three values, nothing else.
          value() { sed -n "s/^$1=//p" "$bundle"; }
          clean="$RUNNER_TEMP/clean-host"
          mkdir -p "$clean"
          value PANGOLIN_AUTH_SECRET > "$clean/auth-secret"
          value RESTIC_PASSWORD > "$clean/restic-password"
          chmod 0400 "$clean/auth-secret" "$clean/restic-password"
          sudo chown 1000:1000 "$clean/auth-secret" "$clean/restic-password"
          docker volume create pangolin-clean-data
          network=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$(docker compose ps -q restic)")
          set -- --network "$network" --read-only --tmpfs /tmp \
            --tmpfs /run:mode=0700,uid=1000,gid=1000,size=1m \
            -v pangolin-clean-data:/data \
            -v "$clean/auth-secret:/secrets/auth-secret:ro" \
            -v "$clean/restic-password:/secrets/restic-password:ro" \
            -e PANGOLIN_AUTH_SECRET_FILE=/secrets/auth-secret \
            -e PANGOLIN_RESTIC_PASSWORD_FILE=/secrets/restic-password \
            -e "PANGOLIN_BACKUP_REPOSITORY=$(value RESTIC_REPOSITORY)" \
            -e PANGOLIN_PUBLIC_URL=http://localhost:3002 \
            -e PANGOLIN_AUTH_RATE_LIMIT=100
          out=$(docker run --rm "$@" pangolin:local node dist/cli.js restore latest)
          echo "$out"
          echo "$out" | grep -qx 'integrity_check: ok'
          echo "$out" | grep -Eq '^Manifest: all [0-9]+ tables match'
          echo "E2E_RESTORED_SNAPSHOT=$(echo "$out" | sed -En 's/^Swapped in snapshot ([0-9a-f]{64}).*/\1/p')" >> "$GITHUB_ENV"
          docker run -d --name pangolin-clean -p 3002:3000 "$@" pangolin:local
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3002/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "The clean host never became healthy" >&2
          docker logs pangolin-clean >&2
          exit 1
      - name: Sign in on the clean host (password and TOTP)
        run: pnpm --filter @pangolin/e2e exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3002
          E2E_RESTORED: "1"
      - name: The admin CLI on the stopped stack (lock path, bundled)
        run: |
          docker compose stop pangolin
          set +e
          out=$(docker compose run --rm --no-deps -T pangolin node dist/cli.js reset-user 2>&1)
          code=$?
          set -e
          echo "$out"
          # No person named: it lists the logins and resets nobody.
          test "$code" -eq 1
          echo "$out" | grep -q "People with a login"
          set +e
          docker compose run --rm --no-deps -T pangolin node dist/cli.js status
          code=$?
          set -e
          test "$code" -eq 3
      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker logs pangolin-clean || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: |
          docker rm -f pangolin-clean || true
          docker volume rm pangolin-clean-data || true
          docker compose down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: re-run the backup/restore test against fresh base images

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        run: pnpm db:generate && git diff --exit-code -- packages/db/migrations
      - run: pnpm --filter @pangolin/web build && pnpm --filter @pangolin/server build
      - name: Only synthetic sample files
        run: scripts/check-samples.sh
      - name: Shell scripts
        run: shellcheck -S warning deploy/install.sh deploy/pangolin scripts/*.sh .githooks/pre-commit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image smoke test (setup, backup, restore)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pangolin:ci
          build-args: PANGOLIN_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/ci-smoke.sh pangolin:ci
      - uses: anchore/scan-action@v6
        with:
          image: pangolin:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true

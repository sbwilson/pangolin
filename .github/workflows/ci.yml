name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: re-run against fresh base images and dependencies

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, STRICT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome + package boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests (Vitest)
        run: pnpm test
      - name: STRICT tables on a freshly migrated database
        run: pnpm check:strict
      - name: Migrations match the schema
        run: pnpm --filter @pangolin/db db:generate && git diff --exit-code -- packages/db/migrations
      - name: Shell scripts
        run: shellcheck -S warning .githooks/pre-commit .githooks/commit-msg scripts/install-git-hooks.sh

  container:
    name: Container and end-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the image
        run: docker compose build
      - name: Scan the image
        uses: anchore/scan-action@v6
        with:
          image: pangolin:local
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Start the stack
        run: docker compose up -d
        env:
          PANGOLIN_PUBLIC_URL: http://localhost:3000
          # The e2e suite signs in more often a minute than the default limit (10) allows.
          PANGOLIN_AUTH_RATE_LIMIT: "100"
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/system/health; then echo; exit 0; fi
            sleep 1
          done
          echo "The container never became healthy" >&2
          exit 1
      - name: Wait for Docker's health status
        run: |
          id=$(docker compose ps -q pangolin)
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            if [ "$status" = healthy ]; then echo "Docker reports $status"; exit 0; fi
            sleep 1
          done
          echo "Docker health status is still $status" >&2
          exit 1
      - name: The server runs as a non-root user
        run: |
          uid=$(docker compose exec -T pangolin sh -c 'stat -c %u /proc/$(pidof -s node)')
          echo "node runs as uid $uid"
          test "$uid" != 0
      - name: The image boots in demo mode
        run: |
          id=$(docker run -d -e PANGOLIN_DEMO=true -p 3001:3000 --read-only --tmpfs /tmp pangolin:local)
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/system/health; then
              echo
              docker rm -f "$id" > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "The demo container never became healthy" >&2
          docker logs "$id" >&2
          docker rm -f "$id" > /dev/null
          exit 1
      - name: Install Chromium for Playwright
        run: pnpm --filter @pangolin/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright against the container)
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          # The first-boot setup link lives in the container's data volume.
          E2E_SETUP_LINK_COMMAND: docker compose exec -T pangolin cat /data/setup-link.txt
      - name: Container logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Production stack for one Pangolin Money server, installed to /opt/pangolin by install.sh.
# Every setting comes from /opt/pangolin/.env (0600), which install.sh writes; secrets live only
# in /opt/pangolin/secrets (0700); the one the app reads reaches it as a read-only file, never as a
# value here.
# The local and CI stack is the compose.yaml at the repository root.
name: pangolin

services:
  pangolin:
    image: ${PANGOLIN_IMAGE:?set PANGOLIN_IMAGE in .env}
    init: true
    # Non-root (the image's `node` user, uid 1000), read-only root, no capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      PANGOLIN_DATA_DIR: /data
      PANGOLIN_AUTH_SECRET_FILE: /secrets/auth-secret
    tmpfs:
      - /tmp:mode=1777,size=64m
      # The admin socket's home (story 1.9): never on the data volume.
      - /run:mode=0700,uid=1000,gid=1000,size=1m
    volumes:
      # The data root must be on the LUKS-encrypted data disk (docs/install.md). On SELinux hosts
      # install.sh sets the modes to `rw,Z` and `ro,Z`.
      - ${PANGOLIN_DATA_ROOT:-/srv/pangolin}:/data:${PANGOLIN_DATA_MOUNT_MODE:-rw}
      # Only the auth secret: app-key and restic-password stay root's on the host until the stories
      # that use them.
      - ./secrets/auth-secret:/secrets/auth-secret:${PANGOLIN_SECRETS_MOUNT_MODE:-ro}
    # Bound on every interface; the nftables firewall admits only the NPM host to this port.
    ports:
      - "0.0.0.0:${PANGOLIN_HTTP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

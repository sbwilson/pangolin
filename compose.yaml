# Local and CI stack. The production stack is deploy/compose.yaml, installed by deploy/install.sh
# (see docs/install.md).
services:
  pangolin:
    build: .
    image: pangolin:local
    init: true
    read_only: true
    tmpfs:
      - /tmp
      # The admin socket's home (`node dist/cli.js`, story 1.9): never on the data volume.
      - /run:mode=0700,uid=1000,gid=1000,size=1m
    environment:
      # The URL the browser opens: writes must come from this origin, passkeys are bound to its
      # host, and setup links point at it. Set it to the public https URL behind a proxy.
      PANGOLIN_PUBLIC_URL: ${PANGOLIN_PUBLIC_URL:-http://localhost:3000}
      # Password sign-ins and two-factor requests per client per minute.
      PANGOLIN_AUTH_RATE_LIMIT: ${PANGOLIN_AUTH_RATE_LIMIT:-10}
      # Backups (story 1.10): empty turns them off. With the `backup` profile,
      # rest:http://restic:8000/pangolin is the append-only rest-server below.
      PANGOLIN_BACKUP_REPOSITORY: ${PANGOLIN_BACKUP_REPOSITORY:-}
      # The recovery bundle's id (story 1.17): the server warns until it is confirmed. Empty: none.
      PANGOLIN_RECOVERY_BUNDLE_ID: ${PANGOLIN_RECOVERY_BUNDLE_ID:-}
    ports:
      - "3000:3000"
    volumes:
      - pangolin-data:/data
      # The restic password as a read-only file (readable by uid 1000); /dev/null (empty) when
      # backups are off.
      - ${PANGOLIN_RESTIC_PASSWORD_HOST_FILE:-/dev/null}:/secrets/restic-password:ro
    restart: unless-stopped
    # Longer than the job runner's 10 s wait for running jobs, so the database closes before
    # Docker's SIGKILL.
    stop_grace_period: 20s

  # An append-only restic REST server, as on the NAS: backups can be added, never removed.
  restic:
    image: restic/rest-server:0.14.0
    profiles: [backup]
    environment:
      DISABLE_AUTHENTICATION: "1"
      OPTIONS: --append-only
    volumes:
      - restic-repo:/data

volumes:
  pangolin-data:
  restic-repo:
